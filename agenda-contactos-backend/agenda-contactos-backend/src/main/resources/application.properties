spring.application.name=agenda-contactos-backend
# 8080 suele estar ocupado (WSL/Docker), por eso usamos 8081
server.port=8081

# SQLite (el archivo contactos.db se crea en la carpeta desde donde se ejecuta la app)
spring.datasource.url=jdbc:sqlite:contactos.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite solo admite un escritor a la vez
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
